<p>user-list works!</p>
<div class="container">
    <div class="row">
        @for(user of userArr();track $index){
            <div class="col-sm-3">
                <div class="card">
                    <img src="https://static.vecteezy.com/system/resources/thumbnails/022/014/184/small/user-icon-member-login-isolated-vector.jpg"
                    class="card-img-top" alt="" height="200">
                    <div class="card-body text-center">
                        <h5 class="card-title">{{user.name}}</h5>
                        <p class="card-text">{{user.id}}</p>
                        <p class="card-text">{{user.username}}</p>
                        <p class="card-text">{{user.address.city}}</p>
                        <p class="card-text">{{user.phone}}</p>
                        <p class="card-text">{{user.email}}</p>
                    </div>
                </div>
            </div>
        }
    </div>
</div>

<div>
    <table class="table table-bordered text-center">
        <thead>
            <th>ID</th>
            <th>Name</th>
            <th>Role</th>
            <th>Status</th>
            <th>Salary</th>
            <th>Gender</th>
            <th>Delete</th>
        </thead>
        <tbody>
            @for(emp of employees;track $index){
                <tr>
                    <td>{{emp.id}}</td>
                    <td>{{emp.name}}</td>
                    <td>{{emp.role}}</td>
                    <td>{{emp.status}}</td>
                    <td>{{emp.salary}}</td>
                    <td>{{emp.gender}}</td>
                    <td>
                        <button class="btn btn-danger btn-sm"
                        (click)="sendIdtoEmpCrud(emp.id)">Delete</button>
                    </td>
                </tr>
            }
        </tbody>
    </table>
</div>

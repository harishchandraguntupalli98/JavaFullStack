<p>template-form works!</p>
<h3 class="text-center">Template Form</h3>
<div class="border border-3 rounded-3 p-3 col-sm-4 offset-4">
    <form #myForm = "ngForm" (submit)="submitMyForm(myForm.value)">
        <p>
            FirstName : <input name="firstName" [(ngModel)]="user.firstName" ngModel #firstName="ngModel"required minlength="5"/>
            @if(firstName.hasError('required')){
                <span class="text-danger">FirstName is Required</span>
            }
            @if(firstName.hasError('minlength')){
                <span class="text-danger">FirstName min 5 Characters</span>
            }
        </p> 
        <p>
            LastName : <input name="lastName" [(ngModel)]="user.lastName" ngModel #lastName="ngModel"/>
        </p>
        <p>
            Email : <input name="email" ngModel #email="ngModel"/>
        </p>
        <div ngModelGroup="address"><p>Street:<input name="street" ngModel #street="ngModel"/></p>
                                    <p>City : <input name="city" ngModel #city="ngModel"/></p>
                                    <p>Pincode :<input name="pincode" ngModel #pincode="ngModel"/></p>
        </div> 
        <input type="reset" value="clear" />
        <input type="submit" value="submit" [disabled]="myForm.invalid"/>
    </form>
    <pre>{{myForm.value | json}}</pre>
</div>

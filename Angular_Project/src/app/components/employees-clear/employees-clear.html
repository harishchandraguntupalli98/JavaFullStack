<p>employee-clear works!</p>
<div>
    <h3>Clear Employee</h3>
<table>
<tbody>
    <th>ID</th>
    <th>Name</th>
    <th>Role</th>
    <th>Delete</th>
</tbody>
@for(emp of employees$ | async ;track $index){
<tr>
<td>{{emp.id}}</td>
<td>{{emp.name}}</td>
<td>{{emp.role}}</td>
<td>
<button (click)="clearEmployee(emp.id)">Clear</button>
</td>
</tr>
}
</table>
</div>

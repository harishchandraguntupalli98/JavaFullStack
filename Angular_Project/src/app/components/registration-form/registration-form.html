<p>registration-form works!</p>
<div class="border-3 rounded-3 p-3 col-sm-4 offset-4">
    <form #regForm ="ngForm" (submit)="submitMyForm(regForm.value)">
        <p>First Name :<input type="text" name="firstName" ngModel #firstName="ngModel" required minlength="3">
            @if(firstName.invalid && firstName.touched){
                <span class="text-danger">First name required (min 3)</span>
                }
        </p>
        <p>Last Name :<input type="text" name="lastName" ngModel required></p>
        <p>Email :<input type="email" name="email" ngModel #email="ngModel" required>
            @if(email.invalid && email.touched){
                <span class="text-danger">Valid Email Required</span>
                }
        </p>
        <p>Gender :<input type="radio" name="gender" value="male" ngModel required> Male
                   <input type="radio" name="gender" value="female" ngModel> Female
        </p>
        <p>Country :<select name="country" ngModel required>
            <option value="">Select Country</option>
            <option value="India">India</option>
            <option value="USA">USA</option>
            <option value="Canada">Canada</option>
            </select>
        </p>
        <p>Skills :<input type="checkbox" name="skills" value="Angular" ngModel> Angular
                   <input type="checkbox" name="skills" value="Java" ngModel> Java
                   <input type="checkbox" name="skills" value="SQL" ngModel> SQL
        </p>
        <p>About You :<textarea name="about" ngModel required minlength="10"></textarea>
        </p>
        <button type="submit" [disabled]="regForm.invalid">Register</button>
        <button type="reset">Clear</button>
    </form>
</div>
<pre>{{regForm.value | json}}</pre>

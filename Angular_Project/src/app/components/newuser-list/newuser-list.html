<p>newuser-list works!</p>
<div>
    <button class="btn btn-danger btn-sm"
    (click)="loadUserData()">Fetch User Data</button>
</div>
@if(isLoading() ){
    <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
}@else{
    <div>
        <table class="table table-bordered text-center">
            <thead>
                <th>Name</th>
                <th>Id</th>
                <th>userName</th>
                <th>address,City</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Delete</th>
                <th>Edit</th>
            </thead>
            <tbody>
            @for(user of newUserArr();track $index){
                <tr>
                    <td>{{user.name}}</td>
                    <td>{{user.id}}</td>
                    <td>{{user.username}}</td>
                    <td>{{user.address?.city}}</td>
                    <td>{{user.phone}}</td>
                    <td>{{user.email}}</td>
                    <td>
                        <button class="btn btn-danger btn-sm"
                        (click)="deleteUser(user.id)">Delete</button>
                    </td>
                    <td>
                        <button class="btn btn-warning btn-sm"
                        (click)="editUser(user)">Edit</button>
                      </td>
                </tr>
            }
        </tbody>
        </table>
        <div>
            <form>
            <input type="text" name="name"placeholder="Name" [(ngModel)]="newEmployee.name">
            <input type="text" name="id"placeholder="Id" [(ngModel)]="newEmployee.id">
            <input type="text" name="username"placeholder="Username" [(ngModel)]="newEmployee.username">
            <input type="text" name="city"placeholder="City" [(ngModel)]="newEmployee.address.city"required>
            <input type="text" name="phone"placeholder="Phone" [(ngModel)]="newEmployee.phone">
            <input type="email" name="email"placeholder="Email" [(ngModel)]="newEmployee.email">
        </form>
            @if(!isEditMode()){
            <button (click)="AddDataToTable()">Add</button>
            }@else{
            <button (click)="updateUser()">Update</button>
            }
        </div>
        </div>
}
